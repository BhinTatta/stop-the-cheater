<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Three couples, one boat. Row everyone across the river — leave someone's partner alone with another man and they kiss." />
    <meta name="theme-color" content="#0d1b2a" />

         origin (see vite.config.ts); it collapses to a relative path locally. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stop the Cheater" />
    <meta property="og:title" content="Stop the Cheater" />
    <meta
      property="og:description"
      content="Three couples, one boat. Row everyone across the river — leave someone's partner alone with another man and they kiss."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Three voxel couples on a riverbank beside a rowboat, under the title Stop the Cheater."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stop the Cheater" />

      name="twitter:description"
      content="Three couples, one boat. Can you get everyone across without a kiss?"
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
